<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation bar -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fs-6 fw-bold">My To-Do List</span>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-6">
        <div class="card app-card border-0 shadow-sm">
          <div class="card-body p-3 p-md-4">

            <!-- Heading -->
            <h1 class="text-center h4 fw-bold mb-1">Task Manager</h1>
            <p class="text-center text-muted small mb-4">Organize your tasks and stay productive.</p>

            <!-- Task input -->
            <div class="input-group">
              <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..."
                     aria-label="New task" aria-describedby="taskError" maxlength="200" autocomplete="off">
              <button class="btn btn-primary" id="addBtn" type="button">Add Task</button>
            </div>
            <div id="taskError" class="text-danger small mt-1 d-none" role="alert"></div>

            <!-- Counter -->
            <div class="d-flex justify-content-between align-items-center my-3">
              <span class="small text-muted">Your tasks</span>
              <span id="taskCounter" class="badge bg-primary">0 remaining</span>
            </div>

            <!-- Filters -->
            <div class="btn-group w-100 mb-3" role="group" aria-label="Filter tasks">
              <button type="button" class="btn btn-sm btn-primary filter-btn" data-filter="all">All</button>
              <button type="button" class="btn btn-sm btn-outline-primary filter-btn" data-filter="active">Active</button>
              <button type="button" class="btn btn-sm btn-outline-primary filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Task list -->
            <ul id="taskList" class="list-group list-group-flush"></ul>
            <p id="emptyMessage" class="text-center small text-muted my-4">No tasks yet. Add your first task!</p>

            <!-- Clear completed -->
            <div class="text-end mt-3">
              <button type="button" class="btn btn-sm btn-outline-danger" id="clearBtn">Clear Completed</button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
